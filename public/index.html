<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#263d21">
    <meta
      name="description"
      content="SwaGrama - Experience the transformative power of Ayurveda, Yoga, Nisarga, Agro, and Tourism for holistic wellness."
    >
    <link rel="icon" href="%PUBLIC_URL%/swagramaLogo.svg" type="image/svg+xml">
    <link rel="alternate icon" href="%PUBLIC_URL%/swagramaLogo.svg">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/swagramaLogo.svg">
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest">
    <link rel="preload" as="image" href="%PUBLIC_URL%/heroPoster.webp" type="image/webp" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      >
    </noscript>
    <title>Swagrama</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() {
            var s = document.createElement('script');
            s.src = 'https://cdn.lordicon.com/lordicon.js';
            s.async = true;
            document.body.appendChild(s);
          }, { timeout: 3000 });
        } else {
          setTimeout(function() {
            var s = document.createElement('script');
            s.src = 'https://cdn.lordicon.com/lordicon.js';
            s.async = true;
            document.body.appendChild(s);
          }, 2000);
        }
      });
    </script>
  </body>
</html>
